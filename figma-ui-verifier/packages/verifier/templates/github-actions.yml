# Figma UI Verification — GitHub Actions Template
# Place this file at .github/workflows/figma-verify.yml in your project
name: Figma UI Verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# Required permissions for PR comments
permissions:
  pull-requests: write
  contents: read

jobs:
  figma-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start dev server
        run: |
          npm run dev &
          sleep 5
          # Wait for server to be ready
          npx wait-on http://localhost:3000 --timeout 30000
        env:
          PORT: 3000

      - name: Run Figma verification
        id: verify
        continue-on-error: true
        run: |
          npx figma-verify \
            --figma-json ./figma-design.json \
            --url http://localhost:3000 \
            --threshold ${{ vars.FIGMA_VERIFY_THRESHOLD || '80' }} \
            --viewports 1440,768,375 \
            --html ./figma-verify-report.html \
            --output ./figma-verify-report.json \
            --skip-instance-children
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-verify-report
          path: ./figma-verify-report.html
          retention-days: 30

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-verify-json
          path: ./figma-verify-report.json
          retention-days: 30

      - name: Parse results
        if: always()
        id: results
        run: |
          if [ -f ./figma-verify-report.json ]; then
            SCORE=$(jq -r '.score' ./figma-verify-report.json)
            PASSED=$(jq -r '.passed' ./figma-verify-report.json)
            echo "score=$SCORE" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
          else
            echo "score=N/A" >> $GITHUB_OUTPUT
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.results.outputs.score }}';
            const passed = '${{ steps.results.outputs.passed }}' === 'true';
            const status = passed ? '✅ PASSED' : '❌ FAILED';
            const emoji = passed ? '🟢' : '🔴';

            const body = `## ${emoji} Figma UI Verification Report

            | Metric | Value |
            |--------|-------|
            | Score | **${score}** |
            | Status | ${status} |
            | Threshold | ${{ vars.FIGMA_VERIFY_THRESHOLD || '80' }} |
            | Viewports | 1440px, 768px, 375px |

            📊 [Download HTML Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---
            <sub>Generated by figma-ui-verifier</sub>`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Figma UI Verification Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Gate check
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::Figma UI verification failed with score ${{ steps.results.outputs.score }}"
          exit 1
