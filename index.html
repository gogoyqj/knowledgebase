<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Roboto', sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top App Bar */
  .app-bar {
    background: #6200ee;
    color: #fff;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
    z-index: 10;
    flex-shrink: 0;
  }
  .app-bar .material-icons { font-size: 28px; }
  .app-bar h1 { font-size: 20px; font-weight: 500; letter-spacing: .15px; }

  /* Layout */
  .container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 300px;
    min-width: 300px;
    background: #fff;
    border-right: 1px solid #e0e0e0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px 16px 8px;
    font-size: 14px;
    font-weight: 500;
    color: #6200ee;
    text-transform: uppercase;
    letter-spacing: 1.25px;
    flex-shrink: 0;
  }
  .search-box {
    margin: 0 12px 8px;
    position: relative;
    flex-shrink: 0;
  }
  .search-box input {
    width: 100%;
    padding: 10px 12px 10px 40px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    background: #f5f5f5;
    transition: border-color .2s, background .2s;
  }
  .search-box input:focus {
    border-color: #6200ee;
    background: #fff;
  }
  .search-box .material-icons {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: #757575;
  }
  .list-wrapper {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  /* List Item */
  .list-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    transition: background .15s;
    gap: 12px;
    border-left: 3px solid transparent;
    user-select: none;
  }
  .list-item:hover { background: #f3e8fd; }
  .list-item.active {
    background: #ede7f6;
    border-left-color: #6200ee;
  }
  .list-item .material-icons {
    font-size: 20px;
    color: #6200ee;
    flex-shrink: 0;
  }
  .list-item .name {
    font-size: 14px;
    color: #212121;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .list-item .count {
    margin-left: auto;
    font-size: 12px;
    color: #9e9e9e;
    flex-shrink: 0;
  }

  /* Content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fafafa;
  }
  .content-bar {
    height: 48px;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 8px;
    flex-shrink: 0;
  }
  .content-bar .material-icons { font-size: 18px; color: #757575; }
  .content-bar span {
    font-size: 14px;
    color: #616161;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .content-frame {
    flex: 1;
    border: none;
    background: #fff;
  }
  .placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #9e9e9e;
    gap: 12px;
  }
  .placeholder .material-icons { font-size: 64px; opacity: .4; }
  .placeholder p { font-size: 16px; }

  /* Empty state */
  .empty {
    padding: 32px 16px;
    text-align: center;
    color: #9e9e9e;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="app-bar">
  <span class="material-icons">menu_book</span>
  <h1>Knowledge Base</h1>
</div>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">Documents</div>
    <div class="search-box">
      <span class="material-icons">search</span>
      <input type="text" id="search" placeholder="Search...">
    </div>
    <div class="list-wrapper" id="list"></div>
  </div>

  <div class="content" id="content">
    <div class="placeholder" id="placeholder">
      <span class="material-icons">description</span>
      <p>Select a document to view</p>
    </div>
  </div>
</div>

<script>
const listEl  = document.getElementById('list');
const content = document.getElementById('content');
const search  = document.getElementById('search');
let items = [];
let activeEl = null;

// Load list.json with no-cache
fetch('list.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => { items = data; render(items); })
  .catch(() => { listEl.innerHTML = '<div class="empty">Failed to load list.json</div>'; });

function render(list) {
  if (!list.length) {
    listEl.innerHTML = '<div class="empty">No matching documents</div>';
    return;
  }
  listEl.innerHTML = list.map((item, i) => `
    <div class="list-item" data-src="${item.src}" data-idx="${i}">
      <span class="material-icons">description</span>
      <span class="name">${item.name}</span>
    </div>
  `).join('');
}

// Click delegation
listEl.addEventListener('click', e => {
  const el = e.target.closest('.list-item');
  if (!el) return;
  const src = el.dataset.src;
  const name = el.querySelector('.name').textContent;

  if (activeEl) activeEl.classList.remove('active');
  el.classList.add('active');
  activeEl = el;

  // Replace content with iframe + top bar
  document.getElementById('placeholder')?.remove();
  let frame = content.querySelector('.content-frame');
  let bar   = content.querySelector('.content-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'content-bar';
    content.prepend(bar);
  }
  if (!frame) {
    frame = document.createElement('iframe');
    frame.className = 'content-frame';
    content.appendChild(frame);
  }
  bar.innerHTML = `<span class="material-icons">description</span><span>${name} — ${src}</span>`;
  frame.src = src;
});

// Search filter
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  const filtered = q ? items.filter(i => i.name.toLowerCase().includes(q)) : items;
  render(filtered);
  // Re-highlight active
  if (activeEl) {
    const src = activeEl.dataset.src;
    const match = listEl.querySelector(`[data-src="${src}"]`);
    if (match) { match.classList.add('active'); activeEl = match; }
  }
});
</script>
</body>
</html>
